<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="visually-hidden">Pomodoro Art</h1>
  <main class="view">
    <div class="art"></div>
    <div class="dock">
      <div class="glass timer">
        <p class="time">25:00</p>
        <div class="buttons">
          <button type="button">Start</button>
          <button type="button" class="quiet">Reset</button>
        </div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
